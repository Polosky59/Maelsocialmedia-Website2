<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style/admin.css">
    <link rel="stylesheet" href="./style/check.css">
</head>

<body>
    <section class="adminD">
        <div class="container">
            <div class="card">
                <h2>Organiser vos rendez-vous</h2>
                <div class="toto">
                    <div class="container-calebdar">
                        <div id="calendar"></div>
                    </div>
                    <div class="container-horraire">
                        <h2>06/05/2027</h2>
                        <div id="hours-list" class="list">
                            <div class="item">
                                <div class="time">
                                    <span class="hour">15h00</span>
                                </div>
                                <div class="checkbox-wrapper-6">
                                    <input class="tgl tgl-light" id="cb1-6" type="checkbox" />
                                    <label class="tgl-btn" for="cb1-6">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div class="container container2">
            <div class="card aling-start">
                <h2>Vos rendez-vous</h2>
                <div class="list">
                    <div class="item">
                        <div class="time">
                            <span class="date">16/06</span>
                            <span class="hour">15h00</span>
                        </div>
                        <div class="info">
                            <span class="client-name">Toto</span>
                            <span class="client-email">toto@gmail.com</span>
                        </div>
                        <div class="status status-confirmed">
                            Confirmé
                        </div>
                    </div>
                </div>
            </div>
    </section>
</body>
<script src="./script/admin.js"></script>

</html>
